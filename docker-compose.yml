services:
  db:
    image: postgres:16-alpine
    container_name: database
    environment:
      POSTGRES_DB: prometheus
      POSTGRES_USER: prometheus
      POSTGRES_PASSWORD: prometheus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prometheus -d prometheus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    working_dir: /app/backend
    command: python run.py
    environment:
      DATABASE_URL: postgresql://prometheus:prometheus@db:5432/prometheus
      SECRET_KEY: change-me
      APP_ENV: development
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
  
  prometheus:
    image: prom/prometheus
    container_name: prometheus-monitoring
    ports:
      - "9090:9090"
    volumes:
      - /home/charan/practise/prometheus/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    depends_on:
      - backend

volumes:
  postgres_data:
