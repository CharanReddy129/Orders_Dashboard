apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: orders-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: charanreddy12/orders-dashboard-frontend:latest
        env:
        - name: VITE_API_BASE_URL
          value: /api
        - name: VITE_API_PROXY_TARGET
          value: http://backend-service:8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "500Mi"
            cpu: "500m"
        ports:
        - containerPort: 5173

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: orders-dashboard
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - port: 5173
    targetPort: 5173
    nodePort: 30011
