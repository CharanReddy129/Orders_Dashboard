name: CI implementation

on:
  push:
    branches:
      - monitoring

env:
  FRONTEND_IMAGE_NAME: orders-dashboard-frontend
  BACKEND_IMAGE_NAME: orders-dashboard-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      
      - name: Set short git commit SHA
        id: vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v3
      
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          output: trivy-fs-report.json
          format: json
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Upload Vulnerability Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.SHORT_SHA }}
      
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.SHORT_SHA }}

      - name: Docker Images List
        run: docker image ls
        
      - name: Run Trivy Image scanner frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          scan-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.SHORT_SHA }}
          severity: HIGH,CRITICAL
          output: frontend-image-report.json
          format: json
          exit-code: 0
      - name: Upload frontend Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-report
          path: frontend-image-report.json

      - name: Run Trivy Image scanner backend 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          scan-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.SHORT_SHA }}
          output: backend-image-report.json
          format: json
          severity: HIGH,CRITICAL
          exit-code: 0
      - name: Upload backend Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-report
          path: backend-image-report.json

      - name: Push Images
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.SHORT_SHA }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.SHORT_SHA }}

      - name: Checkout GitOps repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          repository: CharanReddy129/orders-dashboard-gitops
          token: ${{ secrets.GIT_TOKEN }}
          path: gitops/

      - name: Install yq 
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      
      - name: Update Image tags
        run: |
          yq -i '.frontend.image.tag = strenv(SHORT_SHA)' gitops/helm/values.yaml
          yq -i '.backend.image.tag = strenv(SHORT_SHA)' gitops/helm/values.yaml
      
      - name: Push changes to git
        run: |
          cd gitops

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Updated image tag to ${{ env.SHORT_SHA }}" || echo "No changes"

          git push