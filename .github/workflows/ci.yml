name: CI implementation

on:
  push:
    branches:
      - monitoring

env:
  FRONTEND_IMAGE_NAME: orders-dashboard-frontend
  BACKEND_IMAGE_NAME: orders-dashboard-backend
  # IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      
      - name: Set short git commit SHA
        id: vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v3
      
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          output: trivy-fs-report.json
          format: json
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload Vulnerability Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      

      - name: Build and Push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.SHORT_SHA }}
      
      - name: Build and Push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.SHORT_SHA }}

      - name: Docker Images List
        run: docker image ls
        
      - name: Run Trivy Image scanner frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          scan-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.SHORT_SHA }}
          severity: HIGH,CRITICAL
          output: frontend-image-report.json
          format: json
          exit-code: 1

      - name: Upload frontend Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-report
          path: frontend-image-report.json

      - name: Run Trivy Image scanner backend 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          scan-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.SHORT_SHA }}
          output: backend-image-report.json
          format: json
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Upload backend Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-report
          path: backend-image-report.json
